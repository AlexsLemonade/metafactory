name: score_background
description: |
  Calculate a background (null) score distribution for a library by scoring it against the gene
  label shuffled metaprograms generated for that library's group. This is the permutation
  counterpart of the score metaprograms module: cells are subset and the expression matrix is
  quantile normalized in exactly the same way, and each shuffled metaprogram is scored as the
  weighted dot product of its gene weights and the normalized expression of those genes. Rather
  than per cell scores, the number of cells, the mean score and the sum of squared deviations
  from that mean (M2) are reported for each shuffled metaprogram, which is what Chan's parallel
  variance algorithm needs to pool the null across libraries downstream. One task is run per
  metaprogram set (group_id/n_metaprograms combination) per library.
keywords:
  - single-cell
  - NMF
  - gene expression programs
  - cNMF
  - metaprograms
  - scoring
  - permutation
  - null distribution
tools:
  - anndata:
      description: |
        AnnData is a Python package for handling annotated data matrices in memory
        and on disk, commonly used for single-cell genomics data.
      homepage: https://anndata.readthedocs.io
      documentation: https://anndata.readthedocs.io
      license: ["BSD-3-Clause"]
  - numpy:
      description: |
        NumPy is the fundamental package for array computing with Python.
      homepage: https://numpy.org
      documentation: https://numpy.org/doc/stable/
      license: ["BSD-3-Clause"]
  - pandas:
      description: |
        pandas is a fast, powerful and flexible open source data analysis and manipulation tool.
      homepage: https://pandas.pydata.org
      documentation: https://pandas.pydata.org/docs/
      license: ["BSD-3-Clause"]
  - qnorm:
      description: |
        qnorm is a python implementation of quantile normalization that reproduces the results
        of R's preprocessCore, including its handling of tied values.
      homepage: https://github.com/Maarten-vd-Sande/qnorm
      documentation: https://github.com/Maarten-vd-Sande/qnorm
      license: ["MIT"]
  - scipy:
      description: |
        SciPy is an open-source software for mathematics, science, and engineering, providing
        the sparse matrix routines used to subset the expression matrix and to score all
        shuffled metaprograms in a chunk of replicates with a single matrix multiplication.
      homepage: https://scipy.org
      documentation: https://docs.scipy.org/doc/scipy/
      license: ["BSD-3-Clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing library and metaprogram set information, one map per metaprogram
          set/library combination. Required keys:
          - `unique_id`: Unique identifier for the library being scored.
          - `group_id`: Group identifier shared by all libraries used to generate the metaprograms.
          - `n_metaprograms`: Number of metaprograms (k) in the metaprogram set being scored
            against.
          - `metaprograms_publish_dir`: Subdirectory that all output for this metaprogram set is
            written to, of the form
            `<group_id>/k-<n_metaprograms>_<filtered|unfiltered>[_<orphan_cutoff>]`. Defined once
            in the workflow and shared with the generate metaprograms module so that the
            background stats are written alongside the metaprograms and scores they correspond to.
    - metaprograms_file:
        type: file
        description: |
          Gzipped long format TSV of metaprogram gene weights (columns `metaprogram`, `gene_id`,
          `weight`) from the generate metaprograms module. Present only to define the gene
          universe used for quantile normalization: the shuffled metaprograms hold just the top
          genes of each metaprogram per replicate, so their gene IDs are a subset of the universe
          and normalizing over that subset would put the background scores on a different scale
          than the scores from the score metaprograms module. No weights from this file are used.
        pattern: "*_metaprograms.tsv.gz"
    - shuffled_metaprograms_file:
        type: file
        description: |
          Gzipped long format TSV of gene label shuffled metaprogram gene weights (columns
          `replicate`, `metaprogram`, `gene_id`, `weight`) from the generate metaprograms module.
          Each (replicate, metaprogram) pair is one shuffled metaprogram and holds only its top
          weighted genes, already selected upstream.
        pattern: "*_shuffled_metaprograms.tsv.gz"
    - h5ad_file:
        type: file
        description: |
          Processed AnnData object in H5AD format. Log normalized counts must be in adata.X when
          adata.raw is set, or in a 'logcounts' layer otherwise.
        pattern: "*.h5ad"
  - - options:
        type: map
        description: |
          Groovy Map of the options used to score the cells, supplied as a single value rather
          than one input per option. Required keys:
          - `celltype_annotation_column` (string): Column name in adata.obs containing cell type
            annotations used to subset cells before scoring. Set to empty string to score all
            cells.
          - `analysis_celltypes` (string): Cell type value(s) in the annotations column to keep.
            Multiple values can be supplied as a comma-separated string (e.g. 'tumor,malignant').
            Values must match the annotation exactly. Required when celltype_annotation_column is
            provided.
          - `seed` (integer): Random seed, set for reproducibility and parity with the other
            modules. The shuffling is done upstream when the metaprograms are generated, so this
            process is deterministic.

output:
  - results:
      - meta:
          type: map
          description: Groovy Map of library and metaprogram set information, passed through unchanged from the input channel.
      - "*_background_score_stats.tsv.gz":
          type: file
          description: |
            Gzipped long format TSV, at
            `<metaprograms_publish_dir>/<unique_id>_background_score_stats.tsv.gz`, with one row
            per shuffled metaprogram (columns: `metaprogram`, `replicate`, `num_cells`,
            `mean_mp_score`, `M2`, `unique_id`). `M2` is the sum of squared deviations of the per
            cell scores from `mean_mp_score`; together with `num_cells` and `mean_mp_score` it
            allows the mean and variance of the null to be pooled across libraries using Chan's
            parallel variance algorithm.
          pattern: "*_background_score_stats.tsv.gz"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions for each tool used in the process.
          pattern: "versions.yml"

authors:
  - "@allyhawkins"
maintainers:
  - "@allyhawkins"
