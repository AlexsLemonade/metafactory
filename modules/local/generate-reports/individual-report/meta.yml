name: generate_reports
description: |
  Render the report that evaluates a single set of metaprograms generated for one group of samples
  with one value of k.
keywords:
  - single-cell
  - NMF
  - gene expression programs
  - cNMF
  - metaprograms
  - metrics
  - report
tools:
  - rmarkdown:
      description: |
        R package for converting R Markdown documents into a variety of formats. Used here, with
        knitr and pandoc, to render the report as a single self contained HTML file.
      homepage: https://rmarkdown.rstudio.com
      documentation: https://pkgs.rstudio.com/rmarkdown/
      license: ["GPL-3"]
  - tidyverse:
      description: |
        The tidyverse is a collection of R packages for data science. The readr package is used to
        read the metrics and ORA tables, dplyr and tidyr to summarize and reshape them, tibble and
        purrr to build the Jaccard similarity matrices, stringr and forcats to format labels, and
        ggplot2 to make the plots.
      homepage: https://www.tidyverse.org
      documentation: https://www.tidyverse.org/packages/
      license: ["MIT"]
  - ggforce:
      description: |
        ggplot2 extension providing `geom_sina()`, used to plot the per library coefficient of
        variation of the metaprogram cell scores.
      homepage: https://ggforce.data-imaginist.com
      documentation: https://ggforce.data-imaginist.com/reference/index.html
      license: ["MIT"]
  - ggridges:
      description: |
        ggplot2 extension providing `geom_density_ridges()`, used to plot the distribution of
        metaprogram cell scores across all cells and within each library.
      homepage: https://wilkelab.org/ggridges/
      documentation: https://wilkelab.org/ggridges/reference/index.html
      license: ["GPL-2"]
  - patchwork:
      description: |
        Combines multiple ggplot2 plots into a single figure. Used here to lay out the per
        metaprogram gene set dot plots in a grid.
      homepage: https://patchwork.data-imaginist.com
      documentation: https://patchwork.data-imaginist.com/reference/index.html
      license: ["MIT"]
  - DT:
      description: |
        R interface to the DataTables JavaScript library, used for the scrollable summary table of
        library diversity metrics.
      homepage: https://rstudio.github.io/DT/
      documentation: https://rstudio.github.io/DT/
      license: ["GPL-3"]
  - ComplexHeatmap:
      description: |
        Bioconductor package for making heatmaps, used with circlize for the color scale to show
        spectra and metaprogram correlation matrices and the significance of each gene set across
        metaprograms.
      homepage: https://jokergoo.github.io/ComplexHeatmap-reference/book/
      documentation: https://jokergoo.github.io/ComplexHeatmap-reference/book/
      license: ["MIT"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing group information, one map per group_id. Required keys:
          - `group_id`: Group identifier shared by all samples used to generate the metaprograms.
            Also used as the name of the output directory, so that the report for every group is
            published alongside the other final results for that group.
          - `optimal_k`: Number of metaprograms (k) in the metaprogram set chosen as the final
            result for the group, read back from the optimal k file written by the calculate k
            module. The report evaluates this metaprogram set.
    - metaprograms_file:
        type: file
        description: |
          RDS file of metaprograms for the chosen metaprogram set, as written by the generate
          metaprograms module.
        pattern: "k-*_metaprograms.rds"
    - metaprogram_metrics_file:
        type: file
        description: |
          TSV of per metaprogram metrics for the chosen metaprogram set, as written by the
          calculate metrics metaprograms module.
        pattern: "k-*_mp_metrics.tsv"
    - ora_results_file:
        type: file
        description: |
          TSV of the full over-representation analysis results for the chosen metaprogram set, as
          written by the calculate metrics gene sets module.
        pattern: "k-*_ora_results.tsv"
    - combined_scores_file:
        type: file
        description: |
          Gzipped TSV of per cell metaprogram scores for every library in the group, scored
          against the chosen metaprogram set, as written by the combine scores module.
        pattern: "k-*_combined_metaprogram_scores.tsv.gz"
  - - report_rmd:
        type: file
        description: |
          The R Markdown document to render, `assets/individual-metaprogram-evaluation.Rmd` from
          this module directory. It is staged as an input rather than read from `moduleDir` so
          that it is readable on executors that do not share a filesystem with the launch
          environment, and so that its contents are never interpolated by the nextflow template
          engine. Staged into a `report/` subdirectory of the task directory, so that the copy the
          script renders does not overwrite the staged file itself.
        pattern: "*.Rmd"
  - - options:
        type: map
        description: |
          Groovy Map of the options used to render the report, supplied as a single value rather
          than one input per option. Required keys:
          - `seed` (integer): Random seed, set before plotting so that the jittered sina and
            beeswarm plots are reproducible.

output:
  - report:
      - meta:
          type: map
          description: Groovy Map of group information, passed through unchanged from the input channel.
      - "individual-metaprogram-evaluation.html":
          type: file
          description: |
            Self contained HTML report, at `<group_id>/individual-metaprogram-evaluation.html`.
            Self contained, so no accompanying `_files` directory is written alongside it.
          pattern: "individual-metaprogram-evaluation.html"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions for each tool used in the process.
          pattern: "versions.yml"

authors:
  - "@allyhawkins"
maintainers:
  - "@allyhawkins"
