name: generate-reports
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # R interpreter
  - r-base=4.5

  # rendering the report
  - r-rmarkdown
  - r-knitr
  # == so that 3.12.x builds are not matched
  - pandoc==3.12

  # packages used in report
  - r-tidyverse
  - r-glue
  - r-dt
  - r-ggforce
  - r-ggbeeswarm
  - r-circlize
  - bioconductor-complexheatmap
