lint:
  actions_nf_test: false
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - assets/multiqc_config.yml
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/email_template.txt
    - assets/nf-core-metafactory_logo_light.png
    - docs/images/nf-core-metafactory_logo_light.png
    - docs/images/nf-core-metafactory_logo_dark.png
    - CODE_OF_CONDUCT.md
  files_unchanged:
    - docs/CONTRIBUTING.md
    - assets/sendmail_template.txt
    - .prettierignore
    - .github/PULL_REQUEST_TEMPLATE.md
    - LICENSE
  multiqc_config: false
  included_configs: false
  nextflow_config:
    - config_defaults:
        - params.msigdb_gene_sets
  nf_test_content:
    - tests/params.nf.test
    - tests/nextflow.config
  template_strings:
    - modules/local/generate-reports/metrics-report/assets/combined-metaprogram-metrics.Rmd
    - modules/local/generate-reports/individual-report/assets/individual-metaprogram-evaluation.Rmd
nf_core_version: 4.2.1
repository_type: pipeline
template:
  author: Allegra G. Hawkins
  description: Nextflow pipeline for identifying metaprograms across single-cell/nuclei
    RNA-sequencing samples
  force: false
  is_nfcore: false
  name: metafactory
  org: AlexsLemonade
  outdir: .
  skip_features:
    - igenomes
    - multiqc
    - fastqc
    - codespaces
    - email
